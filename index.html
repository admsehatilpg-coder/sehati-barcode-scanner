
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Barcode SEHATI</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 20px auto;
      padding: 16px;
      color: #173b38;
      background: #f4f8f7;
    }
    h2 { text-align: center; }
    button {
      padding: 12px 16px;
      margin: 6px 3px;
      border: 0;
      border-radius: 8px;
      background: #087c70;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #reader { width: 100%; margin-top: 14px; }
    #status { margin-top: 14px; overflow-wrap: anywhere; }
    #result { font-weight: bold; font-size: 20px; }
  </style>
</head>
<body>
  <h2>Scanner Barcode SEHATI</h2>
  <p>Arahkan kamera belakang HP ke barcode barang.</p>

  <button id="startBtn" type="button">📷 Mulai Scan</button>
  <button id="stopBtn" type="button">Tutup Kamera</button>

  <div id="reader"></div>
  <p id="status">Siap memindai barcode.</p>
  <p id="result"></p>
  <button id="copyBtn" type="button" hidden>Salin Kode Barcode</button>

  <script>
    let scanner = null;
    let sedangScan = false;
    let kodeTerbaca = "";

    function bunyiScanBerhasil() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = 1800;
        gain.gain.value = 0.12;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.085);
        osc.onended = () => ctx.close();
      } catch (e) { console.warn('Bunyi scanner tidak tersedia:', e); }
    }

    function kirimBarcodeKeNota(kode) {
      if (!window.opener || window.opener.closed) {
        statusEl.textContent = 'Barcode terbaca: ' + kode + '. Kembali ke aplikasi nota untuk melanjutkan.';
        return;
      }
      try {
        // Aplikasi nota memvalidasi origin dan sumber pesan sebelum menerima barcode.
        window.opener.postMessage(
          { type: 'SEHATI_BARCODE', barcode: String(kode) },
          '*'
        );
        // Coba aktifkan kembali tab nota setelah barcode terkirim.
        // Browser desktop biasanya mengizinkan ini; browser HP dapat membatasinya.
        try { window.opener.focus(); } catch (_) {}
        statusEl.textContent = 'Barcode terbaca dan dikirim. Beralih kembali ke nota…';
      } catch (e) {
        statusEl.textContent = 'Barcode terbaca: ' + kode + '. Pengiriman otomatis gagal; kembali ke nota.';
      }
    }

    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const copyBtn = document.getElementById("copyBtn");

    startBtn.addEventListener("click", async () => {
      if (sedangScan) return;

      if (!window.Html5Qrcode) {
        statusEl.textContent =
          "Library scanner belum termuat. Periksa koneksi internet.";
        return;
      }

      try {
        scanner = new Html5Qrcode("reader");
        statusEl.textContent = "Meminta izin kamera...";

        await scanner.start(
          { facingMode: "environment" },
          {
  fps: 10,
  qrbox: { width: 300, height: 160 },
  formatsToSupport: [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.ITF
  ]
},
          async (kode) => {
            if (!sedangScan) return;
            sedangScan = false;
            kodeTerbaca = kode;
            try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(String(kode)).catch(() => {}); } catch (e) {}
            resultEl.textContent = "Barcode: " + kode;
            bunyiScanBerhasil();
            copyBtn.hidden = false;
            statusEl.textContent = "Barcode berhasil dibaca.";
            
kirimBarcodeKeNota(kodeTerbaca);


            try { await scanner.stop(); } catch (e) {}
          },
          () => {}
        );

        sedangScan = true;
        statusEl.textContent = "Kamera aktif. Arahkan ke barcode.";
      } catch (err) {
        sedangScan = false;
        statusEl.textContent =
          "Kamera gagal dibuka: " + (err.message || String(err));
      }
    });
window.addEventListener("message", (event) => {
  if (event.source !== window.opener) return;
  if (!event.data || event.data.type !== "SEHATI_BARCODE_ACK") return;
  statusEl.textContent = event.data.found
    ? "Barcode berhasil masuk ke nota. Masukkan jumlah PCS di tab nota."
    : "Barcode diterima nota, tetapi tidak ada di master barang.";
});

window.addEventListener("message", async (event) => {
  if (event.source !== window.opener) return;
  if (!event.data || event.data.type !== "SEHATI_SCAN_LAGI") return;
  if (!scanner || scanner.isScanning) return;

  try {
    sedangScan = true;
    statusEl.textContent = "Kamera aktif. Arahkan ke barcode berikutnya.";

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 300, height: 160 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.ITF
        ]
      },
      async (kode) => {
        if (!sedangScan) return;

        sedangScan = false;
        kodeTerbaca = kode;
        try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(String(kode)).catch(() => {}); } catch (e) {}
        resultEl.textContent = "Barcode: " + kode;
        bunyiScanBerhasil();
        copyBtn.hidden = false;
        statusEl.textContent = "Barcode berhasil dibaca.";

        kirimBarcodeKeNota(kodeTerbaca);

        try {
          await scanner.stop();
        } catch (e) {}
      },
      () => {}
    );
  } catch (err) {
    sedangScan = false;
    statusEl.textContent =
      "Kamera gagal dibuka: " + (err.message || String(err));
  }
});
    stopBtn.addEventListener("click", async () => {
      sedangScan = false;
      if (scanner) {
        try {
          if (scanner.isScanning) await scanner.stop();
          scanner.clear();
        } catch (e) {}
        scanner = null;
      }
      statusEl.textContent = "Kamera ditutup.";
    });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(kodeTerbaca);
        statusEl.textContent = "Kode berhasil disalin. Anda bisa kembali ke nota.";
      } catch (e) {
        statusEl.textContent = "Kode barcode: " + kodeTerbaca;
      }
    });
  </script>
</body>
</html>
